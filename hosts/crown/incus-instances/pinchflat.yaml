config:
  security.nesting: "true"
  user.user-data: |
    #cloud-config
    datasource_list: [NoCloud, None]
description: pinchflat
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br1
    type: nic
  pinchflat-data:
    path: /var/lib/pinchflat
    shift: "true"
    source: /mnt/crownstore/app-storage/pinchflat
    type: disk
  pinchflat-identity:
    path: /run/pinchflat-identity
    readonly: "true"
    shift: "true"
    source: /mnt/crownstore/config/pinchflat/identity
    type: disk
  pinchflat-port:
    connect: tcp:127.0.0.1:8945
    listen: tcp:127.0.0.1:8945
    type: proxy
  pinchflat-youtube:
    path: /mnt/thunderbay/8TB-D/storage/plex/youtube
    shift: "true"
    source: /mnt/thunderbay/8TB-D/storage/plex/youtube
    type: disk
  root:
    path: /
    pool: default
    type: disk
  seed-meta-data:
    path: /var/lib/cloud/seed/nocloud/meta-data
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/pinchflat.meta-data
    type: disk
  seed-network-config:
    path: /var/lib/cloud/seed/nocloud/network-config
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/pinchflat.network-config
    type: disk
  seed-user-data:
    path: /var/lib/cloud/seed/nocloud/user-data
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/pinchflat.user-data
    type: disk
name: pinchflat
