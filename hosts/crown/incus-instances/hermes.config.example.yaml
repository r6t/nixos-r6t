# Copy this shape to:
# /mnt/crownstore/app-storage/hermes/config.yaml
#
# Secrets stay in .env. OAuth credentials are created by Hermes/Codex login
# flows and are not represented in this file.

model:
  # Default to crown's local GPU Qwen service so Hermes has a usable model even
  # before cloud provider auth is completed.
  provider: custom
  default: nvidia/Qwen3-8B-FP8
  base_url: http://127.0.0.1:8088/v1
  context_length: 8192

  # Keep Hermes' native runtime by default. To use ChatGPT subscription auth
  # through Codex's own app-server runtime, install/login inside the nested
  # Hermes Docker container first:
  # npm i -g @openai/codex
  # codex login
  # Then enable the runtime from a Hermes session with:
  # /codex-runtime codex_app_server
  openai_runtime: auto

custom_providers:
  - name: crown-qwen
    base_url: http://127.0.0.1:8088/v1
    api_mode: chat_completions
    models:
      nvidia/Qwen3-8B-FP8:
        context_length: 8192

model_aliases:
  crown-qwen:
    provider: custom
    model: nvidia/Qwen3-8B-FP8
    base_url: http://127.0.0.1:8088/v1
  codex:
    provider: openai-codex
    model: gpt-5.5
  openrouter:
    provider: openrouter
    model: anthropic/claude-sonnet-4

fallback_providers:
  # Primary traffic uses local Qwen above. If that fails, try Codex subscription
  # auth next. OpenRouter is configured as an alias, but not automatic fallback
  # here because it is per-token billed; switch to it explicitly with:
  # /model openrouter
  - provider: openai-codex
    model: gpt-5.5

auxiliary:
  title_generation:
    provider: custom
    model: nvidia/Qwen3-8B-FP8
    base_url: http://127.0.0.1:8088/v1
  compression:
    provider: custom
    model: nvidia/Qwen3-8B-FP8
    base_url: http://127.0.0.1:8088/v1
  goal_judge:
    provider: custom
    model: nvidia/Qwen3-8B-FP8
    base_url: http://127.0.0.1:8088/v1
