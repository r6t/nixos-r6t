config:
  security.nesting: "true"
  user.user-data: |
    #cloud-config
    datasource_list: [NoCloud, None]
description: gitea
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br1
    type: nic
  gitea-data:
    path: /var/lib/gitea
    shift: "true"
    source: /mnt/crownstore/app-storage/gitea
    type: disk
  gitea-ssh-port:
    connect: tcp:127.0.0.1:2222
    listen: tcp:0.0.0.0:2222
    type: proxy
  gitea-web-port:
    connect: tcp:127.0.0.1:3000
    listen: tcp:127.0.0.1:3000
    type: proxy
  root:
    path: /
    pool: default
    type: disk
  seed-meta-data:
    path: /var/lib/cloud/seed/nocloud/meta-data
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/gitea.meta-data
    type: disk
  seed-network-config:
    path: /var/lib/cloud/seed/nocloud/network-config
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/gitea.network-config
    type: disk
  seed-user-data:
    path: /var/lib/cloud/seed/nocloud/user-data
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/gitea.user-data
    type: disk
name: gitea
