config:
  security.nesting: "true"
  user.user-data: |
    #cloud-config
    datasource_list: [NoCloud, None]
description: stirlingpdf
devices:
  eth0:
    name: eth0
    nictype: bridged
    parent: br1
    type: nic
  root:
    path: /
    pool: default
    type: disk
  seed-meta-data:
    path: /var/lib/cloud/seed/nocloud/meta-data
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/stirlingpdf.meta-data
    type: disk
  seed-network-config:
    path: /var/lib/cloud/seed/nocloud/network-config
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/stirlingpdf.network-config
    type: disk
  seed-user-data:
    path: /var/lib/cloud/seed/nocloud/user-data
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/stirlingpdf.user-data
    type: disk
  stirlingpdf-configs:
    path: /var/lib/stirlingpdf/configs
    shift: "true"
    source: /mnt/crownstore/config/stirlingpdf/configs
    type: disk
  stirlingpdf-logs:
    path: /var/log/stirlingpdf
    shift: "true"
    source: /mnt/crownstore/logs/stirlingpdf
    type: disk
  stirlingpdf-port:
    connect: tcp:127.0.0.1:89
    listen: tcp:0.0.0.0:89
    type: proxy
  stirlingpdf-tessdata:
    path: /var/lib/stirlingpdf/tessdata
    shift: "true"
    source: /mnt/crownstore/app-storage/stirlingpdf
    type: disk
name: stirlingpdf
