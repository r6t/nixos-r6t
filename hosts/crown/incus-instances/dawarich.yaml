config:
  limits.cpu: "2"
  limits.memory: 4GiB
  security.nesting: "true"
  user.user-data: |
    #cloud-config
    datasource_list: [NoCloud, None]
description: dawarich
devices:
  dawarich-data:
    path: /var/lib/dawarich
    shift: "true"
    source: /mnt/crownstore/app-storage/dawarich/app
    type: disk
  dawarich-port:
    connect: tcp:127.0.0.1:3000
    listen: tcp:0.0.0.0:3033
    type: proxy
  eth0:
    name: eth0
    nictype: bridged
    parent: br1
    type: nic
  postgres-data:
    path: /var/lib/postgresql
    shift: "true"
    source: /mnt/crownstore/app-storage/dawarich/postgresql
    type: disk
  redis-data:
    path: /var/lib/redis-dawarich
    shift: "true"
    source: /mnt/crownstore/app-storage/dawarich/redis
    type: disk
  root:
    path: /
    pool: default
    type: disk
  seed-meta-data:
    path: /var/lib/cloud/seed/nocloud/meta-data
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/dawarich.meta-data
    type: disk
  seed-network-config:
    path: /var/lib/cloud/seed/nocloud/network-config
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/dawarich.network-config
    type: disk
  seed-user-data:
    path: /var/lib/cloud/seed/nocloud/user-data
    source: /home/r6t/git/nixos-r6t/hosts/crown/incus-instances/seed/dawarich.user-data
    type: disk
name: dawarich
